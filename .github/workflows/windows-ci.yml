name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build the Windows ZIP
        run: npm run package:zip
      - name: Test a fresh extraction of the Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          node scripts/smoke-release.mjs "release/Moye-$version-windows-x64.zip" --targeted
          $staging = Get-ChildItem -LiteralPath .test-data -Directory -Force |
            Where-Object Name -Match '^(package-|desktop-|smoke-zip-)'
          if ($staging) { throw 'Generated staging directories remain after validation' }
      - name: Retain traces on test failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-traces
          path: test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
